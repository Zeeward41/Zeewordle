---
# ===============================================================
# App Server - Install Docker, Configure and run
# ===============================================================
- name: Install and configure Docker and run app containers
  hosts: role_app
  become: true
  roles:
    - name: geerlingguy.docker
  tasks:
    - name: Load database variables
      ansible.builtin.set_fact:
        db_vars: "{{ lookup('ansible.builtin.file', '../../apps/backend/config/db.yaml') | from_yaml }}"

    - name: Enrich db_vars with dynamic secrets from CI/CD
      ansible.builtin.set_fact:
        db_vars: "{{ db_vars | combine({ 'INITIAL_USER_EMAIL': db_vars_initial_email | default(''),'INITIAL_USER_PASSWORD_HASH': db_vars_initial_hash | default('') }) }}"

    - name: Ensure Docker volume exists (postgres_data)
      community.docker.docker_volume:
        name: postgres_data
        state: present

    - name: Create Docker Network
      community.docker.docker_network:
        name: zeewordle_net

    - name: Create the directory for database initialization scripts
      ansible.builtin.file:
        path: /opt/zeewordle/init-db
        state: directory
        mode: '0755'

    - name: Générer le script de création de table
      ansible.builtin.template:
        src: 01_create-tables.sql.j2
        dest: /opt/zeewordle/init-db/01_create-tables.sql
        mode: '0644'

    - name: Générer le script d'insertion de données
      ansible.builtin.template:
        src: 02_insert-seed-data.sql.j2
        dest: /opt/zeewordle/init-db/02_insert-seed-data.sql
        mode: '0644'

    - name: Start PostgreSQL Container
      community.docker.docker_container:
        name: zeewordle_db
        image: postgres:14.23-alpine3.24
        state: started
        restart_policy: always
        shm_size: 128MB
        published_ports:
          - "{{ db_vars.DB_PORT }}:5432"
        networks:
          - name: zeewordle_net
        env:
          POSTGRES_USER: "{{ db_vars.DB_USER }}"
          POSTGRES_PASSWORD: "{{ db_vars.DB_PASSWORD }}"
          POSTGRES_DB: "{{ db_vars.DB_NAME }}"
        volumes:
          - postgres_data:/var/lib/postgresql/data
          - /opt/zeewordle/init-db:/docker-entrypoint-initdb.d:ro

    - name: Get container information (postgresql)
      docker_container_info:
        name: zeewordle_db
      register: container_status_postgresql
      until: container_status_postgresql.container.State.Status == "running"
      retries: 5
      delay: 5

    - name: Assert container postgresql is running
      assert:
        that:
          - container_status_postgresql.container.State.Status == "running"
        fail_msg: "Container 'zeewordle_db' is not running (status: {{ container_status_postgresql.container.State.Status }})"


    - name: Ensure config directory exists on the server (app)
      ansible.builtin.file:
        path: "/opt/zeewordle/config"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: copy development.env file to server (app)
      ansible.builtin.copy:
        src: "../../apps/backend/config/development.env"
        dest: /opt/zeewordle/config/development.env
        owner: root
        group: root
        mode: '0644'

    - name: copy db.yaml file to server (app)
      ansible.builtin.copy:
        src: "../../apps/backend/config/db.env"
        dest: /opt/zeewordle/config/db.env
        owner: root
        group: root
        mode: '0644'

    - name: Set IP_FRONTEND in development environment file
      ansible.builtin.lineinfile:
        path: /opt/zeewordle/config/development.env
        regexp: '^IP_FRONTEND='
        line: "IP_FRONTEND=http://{{ hostvars[groups['role_monitoring_proxy'][0]]['public_ip_address'] }}"
        owner: root
        group: root
        mode: '0644'

    - name: Start First Container (backend)
      community.docker.docker_container:
        name: backend
        image: zeeward41/zeewordle-backend:latest
        state: started
        restart_policy: always
        networks:
          - name: zeewordle_net
        published_ports:
          - "5000:5000"
        volumes:
          - /opt/zeewordle/config/:/app/config/

    - name: Get container information (backend)
      docker_container_info:
        name: backend
      register: container_status_backend
      until: container_status_backend.container.State.Status == "running"
      retries: 5
      delay: 5

    - name: Assert container backend is running
      assert:
        that:
          - container_status_backend.container.State.Status == "running"
        fail_msg: "Container 'backend' is not running (status: {{ container_status_backend.container.State.Status }})"

    - name: Start Second Container (frontend)
      community.docker.docker_container:
        name: frontend
        image: zeeward41/zeewordle-frontend:latest
        state: started
        networks:
          - name: zeewordle_net
        restart_policy: always
        published_ports:
          - "3000:3000"
        env:
          VITE_API_URL: "http://{{ hostvars[groups['role_monitoring_proxy'][0]]['public_ip_address'] }}"
    
    - name: Get container information (frontend)
      docker_container_info:
        name: frontend
      register: container_status_frontend
      until: container_status_frontend.container.State.Status == "running"
      retries: 5
      delay: 5

    - name: Assert container frontend is running
      assert:
        that:
          - container_status_frontend.container.State.Status == "running"
        fail_msg: "Container 'frontend' is not running (status: {{ container_status_frontend.container.State.Status }})"

