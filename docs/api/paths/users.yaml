delete:
    operationId: userDelete
    tags:
        - Users
    summary: 'Delete a user.'
    description: 'Permanently deletes the currently authenticated user account from the database. The user identity is determined securely from the authentication token. This action is irreversible.'
    responses:
        '200':
            $ref: "../components/responses/usersResponses.yaml#/userDelete"
        '401':
            $ref: "../components/responses/globalResponses.yaml#/unauthorizedError"
        '500':
            $ref: "../components/responses/globalResponses.yaml#/serverError"
