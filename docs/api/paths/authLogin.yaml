post:
    operationId: loginUser
    tags:
        - Authentication
    summary: 'Login route'
    description: 'This route is for the user or admin to log on the application.'
    security: []
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: "../components/schemas/users.yaml#/loginRequest"
                examples:
                    loginUser:
                        summary: 'User login with credential'
                        description: "User uses his email 'marc@test.com' with his password 'water'."
                        value:
                            email: 'marc@test.com'
                            password: 'water'
    responses:
        '200':
            $ref: "../components/responses/authResponses.yaml#/loginSuccess"
        '400':
            $ref: "../components/responses/authResponses.yaml#/loginBadRequest"
        '401':
            $ref: "../components/responses/authResponses.yaml#/loginUnauthorized"
        '500':
            #$ref: "../components/responses/globalResponses.yaml#/serverError"
            description: "Something wrong happened"
            content:
                application/json:
                    schema:
                        $ref: "../components/schemas/errorResponse.yaml"
