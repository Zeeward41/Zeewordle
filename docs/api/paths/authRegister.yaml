post:
    operationId: RegisterUser
    tags:
        - Authentication
    summary: 'Register route'
    description: 'This route is for the user to Register on the application.'
    security: []
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: "../components/schemas/users.yaml#/registerRequest"
                examples:
                    registerUser:
                        summary: 'User Register with email, username and password.'
                        description: "User give an email 'marc@test.com', username and a password 'water'."
                        value:
                            email: 'milenia@test.com'
                            password: 'water'
                            username: 'milenia'
    responses:
        '201':
            $ref: "../components/responses/authResponses.yaml#/registerSuccess"
        '400':
            $ref: "../components/responses/authResponses.yaml#/registerBadRequest"
        '409':
            $ref: "../components/responses/authResponses.yaml#/registerConflict"
        '500':
            $ref: "../components/responses/globalResponses.yaml#/serverError"
