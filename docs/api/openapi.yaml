        LoginSuccess:
            $ref: "./components/responses/authResponses.yaml#/loginSuccess"
        LoginUnauthorized:
            $ref: "./components/responses/authResponses.yaml#/loginUnauthorized"
        RegisterSuccess:
            $ref: "./components/responses/authResponses.yaml#/registerSuccess"
        RegisterBadRequest:
            $ref: "./components/responses/authResponses.yaml#/registerBadRequest"
        RegisterConflict:
            $ref: "./components/responses/authResponses.yaml#/registerConflict"
