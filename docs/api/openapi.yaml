servers:
    - url: 'http://localhost:8080/v1'
      description: 'Local development server'
    - url: 'https://dev.xxx.com/v1'
      description: 'Development / Staging server'
    - url: 'https://api.xxx.com/v1'
      description: 'Production server'
tags:
