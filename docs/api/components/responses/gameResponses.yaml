# ----------------------------------------------------
# Game Responses
# ----------------------------------------------------
gameInfo:
  description: "Successfully retrieved the game details."
  content:
    application/json:
      schema:
        $ref: "../schemas/game.yaml#/gameResponse"
      examples:
        gameInfo:
          summary: "Active game details"
          description: "Example of a response returning the full state of an ongoing word puzzle game."
          value:
            game:
              id: 1
              user_id: 1
              word: "CRANE"
              attempts:
                - word: "SMART"
                  result: ["CORRECT", "WRONG", "CORRECT", "CORRECT", "WRONG"]
              status: "IN_PROGRESS"
              created_at: "2026-06-17T15:30:00Z"

# ----

gameNotFound:
  description: "Not Found. No game was found with the provided ID, or it does not belong to the authenticated user."
  content:
    application/json:
      schema:
        $ref: "../schemas/errorResponse.yaml"
      examples:
        gameNotFound:
          summary: "Game not found."
          description: "Example of an error response when the requested game ID does not exist or access is denied."
          value:
            error:
              statusCode: 404
              message: "Game not found or access denied"

# ----

gameBadRequest:
  description: "Bad Request. The submitted word is missing, has an incorrect length, contains invalid characters, or the game is already finished."
  content:
    application/json:
      schema:
        $ref: "../schemas/errorResponse.yaml"
      examples:
        gameBadRequest:
          summary: "Invalid word submission"
          description: "Example of an error response when the player submits a word that does not meet the 5-letter requirement."
          value:
            error:
              statusCode: 400
              message: "The submitted word must be exactly 5 letters long."

# ----

gameGuess:
  description: "Guess processed successfully. Returns the updated game state with color feedback for the grid."
  content:
    application/json:
      schema:
        $ref: "../schemas/game.yaml#/gameResponse"
      examples:
        gameGuessSuccess:
          summary: "Successful guess result"
          description: "Example of a response after evaluating a valid submission."
          value:
            game:
              id: 1
              user_id: 1
              word: "CRANE"
              attempts:
                - word: "SHEEP"
                  result: ["WRONG", "WRONG", "MISPLACED", "WRONG", "WRONG"]
              status: "IN_PROGRESS"
              created_at: "2026-06-17T15:30:00Z"
