description: "The response should contains an object user with an id, username, email and role."
content:
  application/json:
    schema:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "../../openapi.yaml#/components/schemas/User"
    examples:
      loginUserResponse:
        summary: "Response from the server"
        description: "The frontend should receive an ID, email, role and username of the user."
        value:
          user:
            email: "marc@test.com"
            id: 1
            username: "marc"
            role: ["user"]
