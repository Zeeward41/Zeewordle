type: object
required:
  - id
  - username
  - email
  - role
properties:
  id:
    type: integer
    readOnly: true
  username:
    type: string
    minLength: 3
    maxLength: 30
  email:
    type: string
    maxLength: 100
    format: email
  role:
    readOnly: true
    type: array
    items:
      type: string
      enum: [user, admin]
    uniqueItems: true
