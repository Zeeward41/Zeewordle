# ----------------------------------------------------
# User Schemas
# ----------------------------------------------------
loginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      maxLength: 100
    password:
      type: string
      minLength: 5
      maxLength: 100
      writeOnly: true

# ------

registerRequest:
  type: object
  required:
    - email
    - password
    - username
  properties:
    email:
      type: string
      format: email
      maxLength: 100
    password:
      type: string
      minLength: 5
      maxLength: 100
      writeOnly: true
    username:
      type: string
      minLength: 5
      maxLength: 15

# ------

userResponse:
  type: object
  required:
    - user
  properties:
    user:
      $ref: '#/userSummary'

# ------

userSummary:
  type: object
  required:
    - id
    - username
    - email
    - role
  properties:
    id:
      type: integer
      readOnly: true
    username:
      type: string
      minLength: 5
      maxLength: 15
    email:
      type: string
      maxLength: 100
      format: email
    role:
      readOnly: true
      type: array
      items:
        type: string
        enum: [user, admin]
      uniqueItems: true

# ------

userList:
  type: object
  required:
    - users
  properties:
    users:
      type: array
      items:
        $ref: "#/userSummary"
      uniqueItems: true
