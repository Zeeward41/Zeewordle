---
name: CI
# Global Variables
env:
  BETTERLEAKS_URL: 'https://github.com/betterleaks/betterleaks/releases/download/v1.3.1/betterleaks_1.3.1_linux_x64.tar.gz'
  BETTERLEAKS_CHECKSUM: '7b241c80204538cbb210c94514dc7cdff86430938bd7d5b6e289207959530849'
  BETTERLEAKS_ARCHIVE_NAME: 'betterleaks_1.3.1_linux_x64.tar.gz'
  PNPM_VERSION: '11.2.2'
  NODE_VERSION: '25.0.0'
on:
  push:
  workflow_dispatch:
jobs:
  check-credentials-leak:
    runs-on: ubuntu-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v6

      - name: Install and setup Betterleaks (1.3.1)
        run: |
          # 1. Download Betterleaks archive
          curl -sLO ${{ env.BETTERLEAKS_URL }}
          # Check if Archive has been well downloaded
          echo "${{env.BETTERLEAKS_CHECKSUM }} ${{ env.BETTERLEAKS_ARCHIVE_NAME}}" | sha256sum -c
          # untar the archive in betterleaks folder
          tar xzvf ${{ env.BETTERLEAKS_ARCHIVE_NAME }}
          # Move betterleaks to /usr/local/bin
          sudo mv betterleaks /usr/local/bin/
          #Test if betterleaks works
          betterleaks -v

      - name: Check if credentials leaks with betterleaks
        run: |
          # scan the repo with betterleaks
          betterleaks git ${{ github.workspace }} -v --git-workers=4


  detect-Change:
    runs-on: ubuntu-latest
    needs: check-credentials-leak # Only run this job if check-credentials-leak succeeds
    outputs:
      changes: ${{steps.detect-paths.outputs.changes }} # Store the detected path changes as a JSON array
    steps:
      - name: Get the source code
        uses: actions/checkout@v6
      - name: Get path
        uses: dorny/paths-filter@v4
        id: detect-paths
        with:
          # Base = the previous state of the branch on GitHub before the push
          base: ${{ github.event.before }}
          # ref = the latest commit of the current push
          ref: ${{ github.event.after }}
          filters: |
            frontend:
              - 'apps/frontend/**'
            backend:
              - 'apps/backend/**'

  settings-CI:
    runs-on: ubuntu-latest
    # Only run if the previous job detected relevant file changes
    if: ${{ needs.detect-Change.outputs.changes != '[]' && needs.detect-Change.outputs.changes != '' }}
    needs: detect-Change
    strategy:
      # Dynamically spawn parallel jobs for each modified application
      matrix:
        changes: ${{ fromJSON(needs.detect-Change.outputs.changes) }}
    steps:
      - name: Get the source code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }} 

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm' # Caches the pnpm global store to speed up subsequent CI runs
          # Tells the cache action where to find the lockfile inside the matrix app directory
          cache-dependency-path: apps/${{ matrix.changes }}/pnpm-lock.yaml
      - name: Install dependency
        run: |
          # Move to the directory
          cd apps/${{ matrix.changes }}
          # Install dependency
          pnpm i --frozen-lockfile # ensure the exact version of dependencies
          ## Formatter
          pnpm run format
          ## Linter
          pnpm run lint
          ## Unit Test
          pnpm run test
          


