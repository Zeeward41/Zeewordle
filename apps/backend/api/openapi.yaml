tags:
    - name: Authentication
      description: 'Endpoints handling user identity, token generation, login, registration, and session management.'
    - name: Admin
      description: 'Administrative operations restricted to system administrators, including backend configuration and platform oversight.'
    - name: Users
      description: 'Operations related to user account management, profile updates, preferences, and account retrieval.'
    - name: Game
      description: 'Core game mechanics, matchmaking, state updates, leaderboards, and real-time interaction endpoints.'
paths:
