    /auth/logout:
        $ref: './paths/authLogout.yaml'
    /admin/users:
        $ref: './paths/adminListUsers.yaml'
    /admin/users/{id}:
        $ref: './paths/adminUser.yaml'
    /me:
        $ref: './paths/me.yaml'
    /users:
        $ref: './paths/users.yaml'
