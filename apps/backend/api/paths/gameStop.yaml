post:
    operationId: gameStop
    tags:
        - Game
    summary: 'Forcibly stop a game'
    description: 'Ends the specified active game session immediately, changing its status to LOST'
    responses:
        '200':
            $ref: '../components/responses/gameResponses.yaml#/gameStop'
        '401':
            $ref: '../components/responses/globalResponses.yaml#/unauthorizedError'
        '404':
            $ref: '../components/responses/gameResponses.yaml#/gameNotFound'
        '500':
            $ref: '../components/responses/globalResponses.yaml#/serverError'
