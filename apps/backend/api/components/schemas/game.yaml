# ----------------------------------------------------
# Game Schemas
# ----------------------------------------------------
gameStat:
    type: object
    required:
        - id
        - userId
        - wordToGuess
        - maxAttempts
        - guesses
        - status
        - createdAt
        - updatedAt
    properties:
        id:
            type: string
            format: uuid
            example: 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'
        userId:
            type: integer
            minimum: 1
            example: 1
        wordToGuess:
            type: string
            minimum: 1
            example: 5
        maxAttempts:
            type: integer
            default: 6
            example: 6
        guesses:
            type: array
            items:
                $ref: '#/attemptEntry'
            minItems: 0
            maxItems: 6
        status:
            type: string
            enum: [IN_PROGRESS, WON, LOST, ABANDONED]
            example: 'IN_PROGRESS'
        createdAt:
            type: string
            format: date-time
            example: '2026-06-17T15:30:00Z'
        updatedAt:
            type: string
            format: date-time
            example: '2026-06-17T15:30:00Z'

attemptEntry:
    type: object
    required:
        - word
        - result
    properties:
        word:
            type: string
            minLength: 1
            maxLength: 10
            example: 'SMART'
        result:
            type: array
            items:
                type: string
                enum: [CORRECT, MISPLACED, WRONG]
            example: ['CORRECT', 'WRONG', 'CORRECT', 'CORRECT', 'WRONG']

gameResponse:
    type: object
    required: [game]
    properties:
        game:
            $ref: '#/gameStat'

gameGuess:
    type: object
    required: [word]
    properties:
        word:
            type: string
            minLength: 1
            maxLength: 10
            example: 'SMART'

guessResponse:
    type: object
    required: [game]
    properties:
        game:
            $ref: '#/gameStat'
